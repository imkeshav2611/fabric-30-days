name: Post daily carousel

on:
  schedule:
    # GitHub has been starting this repo's scheduled runs about 5 hours late, and drops many.
    # So attempts are queued every 30 min through the night (UTC 20:07 to 05:37).
    # The script refuses to post before 07:30 India time; the first run after that posts,
    # and the rest see "already posted today" and stop. Later attempts are a fallback.
    - cron: "7,37 20-23 * * *"
    - cron: "7,37 0-5 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Day number to post (leave empty for today's)"
        required: false
      dry_run:
        description: "Only print what would be posted"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: linkedin-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Post to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_TOKEN_EXPIRES: ${{ vars.LINKEDIN_TOKEN_EXPIRES }}
          LINKEDIN_VERSION: "202609"
          DAY: ${{ inputs.day }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 scripts/post.py
      - name: Record what was posted
        run: |
          if ! git diff --quiet posted.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posted.json
            git commit -m "Record posted day"
            git push
          fi
